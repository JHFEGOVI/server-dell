services:
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: nginx-proxy
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - /etc/nginx/auth:/etc/nginx/auth:ro
    restart: unless-stopped
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
